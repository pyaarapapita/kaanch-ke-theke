<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark rich roadside-theka background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A140E"/>
      <stop offset="50%" stop-color="#120E0A"/>
      <stop offset="100%" stop-color="#0B0A08"/>
    </linearGradient>

    <!-- Warm golden accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E8D0"/>
      <stop offset="40%" stop-color="#E8D7B5"/>
      <stop offset="100%" stop-color="#B8894A"/>
    </linearGradient>

    <!-- Subtle radial glow behind the mark -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8894A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B8894A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Rounded Square Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#ambientGlow)"/>

  <!-- Warm Gold Metallic Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#B8894A" stroke-width="1.5" stroke-opacity="0.45"/>
  
  <!-- Inner Delicate Frame Accent -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="10.5" fill="none" stroke="#E8D7B5" stroke-width="0.75" stroke-opacity="0.15"/>

  <!-- Crisp Devanagari 'क' Mark (Crafted Vector Geometry for High legibility at 16px-64px) -->
  <g fill="url(#goldGrad)" fill-rule="evenodd">
    <!-- Top Bar (Shirorekha) -->
    <rect x="13" y="13.5" width="38" height="5" rx="1.5"/>

    <!-- Central Vertical Stem (Khadi Pai) -->
    <rect x="29.5" y="13.5" width="5" height="37" rx="1.5"/>

    <!-- Left Closed Loop of 'क' (Outer curve & inner cutout) -->
    <path d="M 30 21.5 C 20.5 21.5 15.5 25.5 15.5 31 C 15.5 36.5 20.5 40.5 30 40.5 Z M 29.5 26 C 23.5 26 20 28 20 31 C 20 34 23.5 36 29.5 36 Z" />

    <!-- Right Sweeping Hook of 'क' (Outer curve & inner arch) -->
    <path d="M 30 21.5 C 38.5 21.5 46.5 25.5 46.5 33 C 46.5 38.5 43.5 44.5 37 47.5 C 35.8 48 34.6 46.4 35.6 45.4 C 40.5 41.5 41.5 37 41.5 33 C 41.5 29 37 26 30 26 Z" />
  </g>
</svg>